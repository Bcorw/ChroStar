plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 仓库内签名密钥: 任何机器/任何一次重建都产出同一签名, 已安装版本可直接覆盖升级。
// 密钥是公开的, 风险与轮换方式见 signing/README.md。
def signingDir = new File(rootProject.projectDir.parentFile, 'signing')
def keystorePropsFile = new File(signingDir, 'keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasRepoKey = keystorePropsFile.exists()

android {
    namespace 'io.github.ylw6669.chrostar'
    compileSdk 37

    defaultConfig {
        applicationId "io.github.ylw6669.chrostar"
        minSdk 33
        targetSdk 34
        versionCode 84
        versionName "2.5.1"
    }

    signingConfigs {
        if (hasRepoKey) {
            chrostar {
                storeFile new File(signingDir, keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // 优先用仓库内密钥; 缺失时回落到调试密钥(签名会变, 无法覆盖升级)
            if (hasRepoKey) {
                signingConfig signingConfigs.chrostar
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (hasRepoKey) {
                signingConfig signingConfigs.chrostar
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        buildConfig true
    }
}

dependencies {
    // LSPosed API (compileOnly：运行时由 LSPosed 框架提供)
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'

    // Compose + Miuix (HyperOS 风格 UI, 0.9.2 稳定版)
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    // material3 已移除: 全部改用 Miuix 组件
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.2'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.2'
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.3'
}
